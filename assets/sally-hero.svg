<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">AC Engineer Sally — sua equipe, no rádio</title>
  <desc id="desc">Banner preto e dourado com headset, ondas de rádio e as palavras spotter, combustível e estratégia.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151921"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#ffd43b" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffd43b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffb923"/>
      <stop offset=".5" stop-color="#ffe780"/>
      <stop offset="1" stop-color="#ffd43b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#dce4ef" stroke-opacity=".035"/>
    </pattern>
    <pattern id="check" width="28" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#ffd43b"/>
      <rect x="14" width="14" height="14" fill="#151921"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="440" rx="24"/></clipPath>
  </defs>
  <style>
    .signal { animation: signal 3s ease-in-out infinite; }
    .wave { transform-box: fill-box; transform-origin: center; animation: wave 1.5s ease-in-out infinite alternate; }
    .wave:nth-child(2n) { animation-delay: -.7s; }
    .wave:nth-child(3n) { animation-delay: -1.1s; }
    @keyframes signal { 0%, 100% { opacity: .95; } 50% { opacity: .35; } }
    @keyframes wave { from { transform: scaleY(.4); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .signal, .wave { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="url(#background)"/>
    <rect width="1200" height="440" fill="url(#grid)"/>
    <ellipse cx="1035" cy="205" rx="330" ry="260" fill="url(#glow)"/>
    <path d="M995 440H1115L1200 355V235Z" fill="#ffd43b" fill-opacity=".07"/>
    <path d="M1135 440H1170L1200 410V375Z" fill="#ffd43b" fill-opacity=".18"/>
    <rect width="1200" height="14" fill="url(#check)" opacity=".85"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="64" y="56" width="200" height="32" rx="16" fill="#ffd43b" fill-opacity=".08" stroke="#ffd43b" stroke-opacity=".4"/>
      <circle class="signal" cx="84" cy="72" r="4" fill="#ffd43b"/>
      <text x="98" y="77" font-size="11" font-weight="700" letter-spacing="2" fill="#ffe780">INDIE RACE ENGINEER</text>
      <text x="64" y="142" font-size="21" font-weight="700" letter-spacing="8" fill="#c4cbd5">AC ENGINEER</text>
      <text x="58" y="238" font-size="110" font-weight="800" letter-spacing="-5" fill="url(#gold)">SALLY</text>
      <text x="64" y="285" font-size="29" font-weight="700" fill="#f4f6fb">Sua equipe, no rádio.</text>
      <text x="64" y="316" font-size="16" fill="#9ca7b7">Você pilota. Sally acompanha. • Assetto Corsa + CSP</text>
      <g font-size="11" font-weight="700" letter-spacing="1.4" fill="#e8edf5">
        <rect x="64" y="348" width="140" height="38" rx="9" fill="#171d27" stroke="#303847"/>
        <circle cx="84" cy="367" r="4" fill="#ffd43b"/>
        <text x="98" y="371">SPOTTER</text>
        <rect x="216" y="348" width="182" height="38" rx="9" fill="#171d27" stroke="#303847"/>
        <circle cx="236" cy="367" r="4" fill="#ffd43b"/>
        <text x="250" y="371">COMBUSTÍVEL</text>
        <rect x="410" y="348" width="174" height="38" rx="9" fill="#171d27" stroke="#303847"/>
        <circle cx="430" cy="367" r="4" fill="#ffd43b"/>
        <text x="444" y="371">ESTRATÉGIA</text>
      </g>
      <rect x="820" y="50" width="280" height="38" rx="19" fill="#0e131b" stroke="#3d3828"/>
      <circle class="signal" cx="843" cy="69" r="5" fill="#ffd43b"/>
      <text x="860" y="74" font-size="12" font-weight="700" letter-spacing="2" fill="#ffe780">SALLY / RADIO CHANNEL</text>
    </g>
    <g transform="translate(960 224)" fill="none">
      <circle r="137" stroke="#ffd43b" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="3 12"/>
      <circle r="116" stroke="#ffd43b" stroke-opacity=".08"/>
      <path d="M-73 19V-22a73 73 0 0 1 146 0V19" stroke="#eef1f8" stroke-width="9" stroke-linecap="round"/>
      <path d="M-58-35a60 60 0 0 1 116 0" stroke="#ffd43b" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
      <rect x="-87" y="-10" width="28" height="63" rx="12" fill="#1b222e" stroke="#ffd43b" stroke-width="3"/>
      <rect x="59" y="-10" width="28" height="63" rx="12" fill="#1b222e" stroke="#ffd43b" stroke-width="3"/>
      <path d="M73 50Q73 82 24 82" stroke="#eef1f8" stroke-width="5" stroke-linecap="round"/>
      <rect x="-8" y="72" width="36" height="18" rx="9" fill="#ffd43b"/>
      <g fill="#ffd43b">
        <rect class="wave" x="-43" y="5" width="7" height="18" rx="3.5"/>
        <rect class="wave" x="-28" y="-4" width="7" height="36" rx="3.5"/>
        <rect class="wave" x="-13" y="-16" width="7" height="60" rx="3.5"/>
        <rect class="wave" x="2" y="-10" width="7" height="48" rx="3.5"/>
        <rect class="wave" x="17" y="-1" width="7" height="30" rx="3.5"/>
        <rect class="wave" x="32" y="7" width="7" height="14" rx="3.5"/>
      </g>
    </g>
    <text x="960" y="397" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3" fill="#9ca7b7">TELEMETRIA → RÁDIO</text>
    <rect y="434" width="1200" height="6" fill="url(#gold)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="439" rx="24" fill="none" stroke="#363944"/>
</svg>

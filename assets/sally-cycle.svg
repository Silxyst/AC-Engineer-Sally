<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="274" viewBox="0 0 1200 274" role="img" aria-labelledby="title desc">
  <title id="title">Da telemetria ao rádio — AC Engineer Sally</title>
  <desc id="desc">Quatro etapas ilustrativas: leitura dos dados, avaliação do contexto, prioridade das chamadas e reprodução com legenda.</desc>
  <defs>
    <linearGradient id="track" x1="46" y1="0" x2="1154" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#55cba0"/>
    </linearGradient>
  </defs>
  <style>
    .progress { animation: travel 8s linear infinite; }
    .focus { animation: focus 8s step-end infinite; }
    .two { animation-delay: 2s; }
    .three { animation-delay: 4s; }
    .four { animation-delay: 6s; }
    @keyframes travel { from { transform: translateX(0); } to { transform: translateX(1108px); } }
    @keyframes focus { 0% { opacity: 1; } 25%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .progress, .focus { animation: none; } .focus { opacity: .45; } }
  </style>
  <rect x=".5" y=".5" width="1199" height="273" rx="20" fill="#10151d" stroke="#303847"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="46" cy="32" r="4" fill="#ffd43b"/>
    <text x="60" y="37" font-size="13" font-weight="700" letter-spacing="2" fill="#c4cbd5">DA TELEMETRIA AO RÁDIO</text>
    <text x="1154" y="37" text-anchor="end" font-size="10" letter-spacing="1.5" fill="#8f9cae">FLUXO ILUSTRATIVO</text>
    <rect x="46" y="57" width="1108" height="4" rx="2" fill="#29323f"/>
    <rect x="46" y="57" width="1108" height="4" rx="2" fill="url(#track)" opacity=".25"/>
    <circle class="progress" cx="46" cy="59" r="5" fill="#ffe780"/>
    <g transform="translate(46 84)">
      <rect width="254" height="140" rx="14" fill="#181f2a" stroke="#38404e"/>
      <rect class="focus" x="1" y="1" width="252" height="138" rx="13" fill="none" stroke="#ffd43b" stroke-width="2"/>
      <text x="20" y="28" font-size="11" font-weight="700" letter-spacing="2" fill="#ffd43b">01 / OBSERVAR</text>
      <text x="20" y="60" font-size="19" font-weight="700" fill="#f4f6fb">Telemetria</text>
      <text x="20" y="91" font-size="13" fill="#a2afc1">Carro, sessão e rivais.</text>
      <text x="20" y="113" font-size="13" fill="#a2afc1">Leitura dos dados ao vivo.</text>
    </g>
    <g transform="translate(331 84)">
      <rect width="254" height="140" rx="14" fill="#181f2a" stroke="#38404e"/>
      <rect class="focus two" x="1" y="1" width="252" height="138" rx="13" fill="none" stroke="#ffd43b" stroke-width="2" opacity="0"/>
      <text x="20" y="28" font-size="11" font-weight="700" letter-spacing="2" fill="#ffd43b">02 / ENTENDER</text>
      <text x="20" y="60" font-size="19" font-weight="700" fill="#f4f6fb">Contexto</text>
      <text x="20" y="91" font-size="13" fill="#a2afc1">Gatilhos de corrida.</text>
      <text x="20" y="113" font-size="13" fill="#a2afc1">Estratégia e cooldowns.</text>
    </g>
    <g transform="translate(616 84)">
      <rect width="254" height="140" rx="14" fill="#181f2a" stroke="#38404e"/>
      <rect class="focus three" x="1" y="1" width="252" height="138" rx="13" fill="none" stroke="#ffd43b" stroke-width="2" opacity="0"/>
      <text x="20" y="28" font-size="11" font-weight="700" letter-spacing="2" fill="#ffd43b">03 / ORGANIZAR</text>
      <text x="20" y="60" font-size="19" font-weight="700" fill="#f4f6fb">Prioridade</text>
      <text x="20" y="91" font-size="13" fill="#a2afc1">Fila de mensagens.</text>
      <text x="20" y="113" font-size="13" fill="#a2afc1">Spotter em primeiro lugar.</text>
    </g>
    <g transform="translate(901 84)">
      <rect width="254" height="140" rx="14" fill="#181f2a" stroke="#38404e"/>
      <rect class="focus four" x="1" y="1" width="252" height="138" rx="13" fill="none" stroke="#55cba0" stroke-width="2" opacity="0"/>
      <text x="20" y="28" font-size="11" font-weight="700" letter-spacing="2" fill="#55cba0">04 / INFORMAR</text>
      <text x="20" y="60" font-size="19" font-weight="700" fill="#f4f6fb">Sally no rádio</text>
      <text x="20" y="91" font-size="13" fill="#a2afc1">Voz gravada em inglês.</text>
      <text x="20" y="113" font-size="13" fill="#a2afc1">Legendas em PT-BR ou EN.</text>
    </g>
    <g font-size="28" fill="#586376">
      <text x="309" y="165">›</text>
      <text x="594" y="165">›</text>
      <text x="879" y="165">›</text>
    </g>
    <text x="600" y="253" text-anchor="middle" font-size="12" fill="#8f9cae">Você acompanha a pista. Sally acompanha a corrida.</text>
  </g>
</svg>
